# Автообновления зависимостей. Закреплённые версии без обновлений = накопление CVE,
# поэтому Dependabot каждую неделю открывает PR, а DevSecOps-пайплайн их проверяет.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  # Обновляет SHA закреплённых GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
