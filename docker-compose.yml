# Локальная dev-среда. Порты Postgres/Redis проброшены только на 127.0.0.1:
# с 0.0.0.0 они были бы доступны всей сети (частая причина утечек БД).
services:
  backend:
    build:
      context: ./backend
    container_name: aegis_arena_backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-server-header
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16-alpine
    container_name: aegis_arena_postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_arena"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegis_arena_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data: